{% extends "layout.html" %}

{% block title %}Applications{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="mb-0">Applications</h1>
    <span id="app-count" class="badge bg-secondary fs-6"></span>
</div>

<div class="row g-3 mb-4">
    <div class="col-md-4">
        <input type="text" id="search" class="form-control" placeholder="Rechercher...">
    </div>
    <div class="col-md-3">
        <select id="filter-namespace" class="form-select">
            <option value="">Tous les namespaces</option>
        </select>
    </div>
    <div class="col-md-3">
        <select id="filter-group" class="form-select">
            <option value="">Tous les groupes</option>
        </select>
    </div>
    <div class="col-md-2">
        <select id="filter-active" class="form-select">
            <option value="">Actives & inactives</option>
            <option value="true" selected>Actives uniquement</option>
            <option value="false">Inactives uniquement</option>
            <option value="suspended">Suspendues uniquement</option>
        </select>
    </div>
</div>

<div class="table-responsive">
    <table class="table table-hover align-middle" id="apps-table">
        <thead class="table-dark">
            <tr>
                <th class="sortable" data-sort="name">Application</th>
                <th class="sortable" data-sort="namespace">Namespace</th>
                <th class="sortable" data-sort="version">Version</th>
                <th class="sortable" data-sort="group">Groupe</th>
                <th>Accès</th>
                <th>Infra</th>
                <th>Statut</th>
            </tr>
        </thead>
        <tbody id="apps-body">
            <tr><td colspan="7" class="text-center text-muted">Chargement...</td></tr>
        </tbody>
    </table>
</div>

<!-- Modal Detail Application -->
<div class="modal fade" id="appDetailModal" tabindex="-1" aria-labelledby="appDetailModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <div class="d-flex align-items-center">
          <img id="modal-icon" src="" width="28" height="28" class="me-2 rounded d-none" onerror="this.classList.add('d-none')">
          <h5 class="modal-title" id="appDetailModalLabel">Application</h5>
          <span id="modal-ns-badge" class="badge bg-primary ms-2"></span>
          <span id="modal-active-badge" class="badge ms-1"></span>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
      </div>
      <div class="modal-body">
        <div id="modal-loading" class="text-center py-5">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Chargement...</span>
          </div>
        </div>
        <div id="modal-error" class="alert alert-danger d-none"></div>
        <div id="modal-content" class="d-none">
          <ul class="nav nav-tabs" id="subappTabs" role="tablist"></ul>
          <div class="tab-content pt-3" id="subappTabContent"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fermer</button>
        <button type="button" class="btn btn-primary d-none" id="modal-edit-btn">
          <i class="fas fa-edit"></i> Modifier
        </button>
        <button type="button" class="btn btn-success d-none" id="modal-save-btn">
          <i class="fas fa-save"></i> Enregistrer
        </button>
        <button type="button" class="btn btn-outline-secondary d-none" id="modal-cancel-btn">Annuler</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
<script src="{{ url_for('static', filename='js/app-detail.js') }}"></script>
{% endblock %}
